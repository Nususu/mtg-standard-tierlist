<title>Mono-Blue Control - all lists</title>
<style>
  :root {
    --bg: #f7f8fa; --panel: #ffffff; --ink: #14181f; --ink-soft: #5b6472; --line: #dde1e8;
    --accent: #2757c9;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c0e12; --panel: #171a21; --ink: #e7eaf0; --ink-soft: #99a2b3; --line: #2a2f3a;
      --accent: #6f9bff;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c0e12; --panel: #171a21; --ink: #e7eaf0; --ink-soft: #99a2b3; --line: #2a2f3a;
    --accent: #6f9bff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .wrap { max-width: 820px; margin: 0 auto; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  .sub { color: var(--ink-soft); font-size: 0.85rem; margin: 0 0 16px; }
  .back { display: inline-block; margin-bottom: 16px; color: var(--accent); text-decoration: none; font-size: 0.85rem; }
  .back:hover { text-decoration: underline; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--ink-soft); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.02em; }
  td.num, th.num { text-align: right; }
  td a { color: var(--accent); text-decoration: none; }
  td a:hover { text-decoration: underline; }
</style>
</head>
